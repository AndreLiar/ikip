name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # uv provisions the interpreter from `requires-python` (>=3.12) during sync.

      # Baseline for Story 1.4 (CI Pipeline & Baseline Testing). Grows into
      # lint+test (Next.js web) as Epic 1 lands TS code. Enforces Python
      # lint+format (ruff) + hermetic unit tests (pytest), and guards secrets.
      - name: Install workspace (hermetic; no live services)
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests (pytest)
        run: uv run pytest apps packages services -q

      - name: Guard against committed secrets
        run: |
          # Match real secret ASSIGNMENTS (KEY=value with a value), not identifiers
          # used as config aliases, and PEM private-key blocks.
          if grep -rInE \
               '((AZURE_OPENAI_API_KEY|R2_SECRET_ACCESS_KEY|LANGFUSE_SECRET_KEY)[[:space:]]*=[[:space:]]*[A-Za-z0-9/+_-]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --include='*.py' --include='*.ts' --include='*.tsx' . ; then
            echo "::error::Potential secret committed"; exit 1
          fi
          echo "No obvious secrets found."

  safety-gate:
    name: safety-gate
    runs-on: ubuntu-latest
    # Story 5.3 — critical safety-abstention gate. Deterministic + network-free (scripted
    # fakes over the real grounded-answer graph), so it is a REQUIRED release gate that
    # runs on every PR including forks (no DB, no secrets). A failure blocks release.
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install workspace (+ graph runtime for the answer flow)
        run: uv sync --group embeddings

      - name: Critical safety-abstention suite (must be 100%)
        run: uv run --group embeddings pytest packages/common/tests/test_safety_suite.py -q

      - name: Prompt-injection & malicious-document defenses (Story 6.3)
        run: uv run --group embeddings pytest packages/common/tests/test_injection.py -q

      - name: Safety gate report (abstained vs. answered; exit 1 blocks release)
        run: uv run --group embeddings python -m ikip_common.eval safety

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    # Story 6.4 AC4 — dependency/security scanning. Runs on every PR and reports CVEs for
    # Python (pip-audit) + web (pnpm audit). Non-blocking (continue-on-error): transitive
    # advisories shouldn't block unrelated work, but they are surfaced in the logs/summary.
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install workspace
        run: uv sync

      - name: pip-audit (Python dependencies)
        continue-on-error: true
        run: uv run --with pip-audit pip-audit --progress-spinner off

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web deps
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (web dependencies)
        continue-on-error: true
        run: pnpm --filter @ikip/web audit --audit-level high

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@9.12.0); don't
      # also set `version` here or action-setup errors on a version mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: OpenAPI client is up to date
        # Deterministic drift guard: regenerate the TS types from the committed
        # openapi.json and fail if they differ from what's committed. (The openapi.json
        # itself is produced by `uv run python -m ikip_api.openapi` when the API changes.)
        run: |
          pnpm --filter @ikip/web gen:api
          git diff --exit-code apps/web/lib/api-schema.ts \
            || { echo "::error::api-schema.ts is stale — run 'pnpm --filter @ikip/web gen:api'"; exit 1; }

      - name: Prettier check (web)
        run: pnpm exec prettier --check "apps/web/**/*.{ts,tsx,css,json,mjs}"

      - name: Lint (eslint)
        run: pnpm --filter @ikip/web lint

      - name: Typecheck
        run: pnpm --filter @ikip/web typecheck

      - name: Unit tests (vitest)
        run: pnpm --filter @ikip/web test

      - name: Build (next)
        run: pnpm --filter @ikip/web build
