[project]
name = "ikip-common"
version = "0.1.0"
description = "IKIP shared models, infra ports, and configuration"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.9",
]
# The connectivity doctor's heavy clients (boto3, psycopg, redis, httpx) are
# imported lazily and declared as a root `doctor` dependency-group, so the core
# package stays light: `uv run --group doctor python -m ikip_common.doctor`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ikip_common"]
