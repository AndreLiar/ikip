name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Baseline for Story 1.4 (CI Pipeline & Baseline Testing). Grows into pytest
      # (Python) and lint+test (Next.js web) as Epic 1 lands real code. For now it
      # enforces Python lint+format (ruff) and guards against committed secrets.
      - name: Install ruff
        run: pip install --quiet ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Guard against committed secrets
        run: |
          if grep -rInE '(AZURE_OPENAI_API_KEY|AZURE_OPENAI_KEY|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.env' . ; then
            echo "::error::Potential secret committed"; exit 1
          fi
          echo "No obvious secrets found."
