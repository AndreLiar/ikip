name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Baseline for Story 1.4 (CI Pipeline & Baseline Testing).
      # This grows into ruff + pytest (Python services/api) and lint + test
      # (Next.js web) as Epic 1 lands real code. For now — a docs-only repo —
      # it validates that all committed Python is syntactically valid and that
      # no obvious secrets were committed.
      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Guard against committed secrets
        run: |
          if grep -rInE '(AZURE_OPENAI_API_KEY|AZURE_OPENAI_KEY|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.env' . ; then
            echo "::error::Potential secret committed"; exit 1
          fi
          echo "No obvious secrets found."
