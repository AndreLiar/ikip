[project]
name = "ikip-api"
version = "0.1.0"
description = "IKIP FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "ikip-common",
  # Clients used by the health check to probe real dependencies.
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ikip_api"]

[tool.uv.sources]
ikip-common = { workspace = true }
