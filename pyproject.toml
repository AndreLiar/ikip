# Root Python project config for the IKIP monorepo.
# Dependency/env management: uv (https://docs.astral.sh/uv/). Per-service deps are
# added as uv workspace members when their code lands (Story 1.3+). This root file
# holds the shared lint/format config (ruff) used across all Python code.

[project]
name = "ikip"
version = "0.1.0"
description = "Industrial Knowledge Intelligence Platform (IKIP) — monorepo root"
requires-python = ">=3.12"

# uv workspace: Python packages/services are members. Shared dev deps live here.
# Members are added as their code lands (packages/ai-clients, services/*).
[tool.uv.workspace]
members = ["packages/common", "apps/api", "services/ingestion", "services/document-processing"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "ikip-common", "ikip-api", "ikip-ingestion", "ikip-docproc"]
# Connectivity doctor clients (optional): uv run --group doctor python -m ikip_common.doctor
doctor = ["boto3>=1.35", "psycopg[binary]>=3.2", "redis>=5.0", "httpx>=0.27"]
# Dagster (heavy; opt-in): uv run --group dagster pytest services/ingestion/tests/test_definitions.py
dagster = ["dagster>=1.9,<1.12", "dagster-webserver>=1.9,<1.12"]
# Extraction engines (heavy; opt-in): uv run --group extraction pytest services/document-processing/tests
extraction = ["pymupdf>=1.24", "pytesseract>=0.3.13", "pillow>=10.4"]
# Embedding + retrieval + RAG bricks (opt-in; lazy-imported like boto3). We reuse
# LangChain components BEHIND our ports (ADR 0021): langchain-openai -> AzureOpenAIEmbeddings;
# langchain-core -> Document/BaseRetriever; langchain -> langgraph (request-time graph, 3.5).
# RRF fusion is implemented in-house (EnsembleRetriever moved to a legacy compat pkg in
# LangChain 1.x; the algorithm is ~15 lines). Fake-client tests need none of this.
embeddings = ["langchain-openai>=0.2", "langchain-core>=0.3", "langchain>=0.3"]
# Redis-backed Cache adapter (Story 3.7, ADR 0009; lazy-imported). FakeCache needs none.
cache = ["redis>=5.0"]

[tool.uv.sources]
ikip-common = { workspace = true }
ikip-api = { workspace = true }
ikip-ingestion = { workspace = true }
ikip-docproc = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
# One tool for lint + format (replaces black + isort + flake8).
target-version = "py312"
line-length = 100
# Lint/format application code only. `docs/` holds documentation artifacts
# (diagram-as-code generators with intentionally loose style, illustrative
# code blocks) that are not application source — excluded on purpose.
extend-exclude = [".venv", "venv", "node_modules", "**/.gitkeep", "docs"]

[tool.ruff.lint]
# Sensible, not noisy: pyflakes(F), pycodestyle(E/W), isort(I), bugbear(B),
# comprehensions(C4), pyupgrade(UP), naming(N).
select = ["F", "E", "W", "I", "B", "C4", "UP", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "services", "tests"]
python_files = ["test_*.py", "*_test.py"]
