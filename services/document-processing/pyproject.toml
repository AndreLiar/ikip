[project]
name = "ikip-docproc"
version = "0.1.0"
description = "IKIP document processing — PDF extraction, OCR, cleaning"
requires-python = ">=3.12"
# Core (models + two-stage orchestration + quality scoring) is engine-free so it
# stays fast/testable in CI. The heavy extraction engines are an optional extra.
dependencies = [
  "ikip-common",
  # Validation (Story 2.4): Pydantic (metadata schema) + Pandera (tabular quality).
  # Light vs the extraction engines, so cleaning/validation stay in the fast CI job.
  "pandera[pandas]>=0.20",
]

[project.optional-dependencies]
# Extraction engines (heavy; opt-in). Docling pulls ML models (~1GB); keep out of
# the fast CI job. Installed in the processing worker image / `--group extraction`.
#   PyMuPDF  = native text + table detection (stage 1, fast, $0)
#   pytesseract = OCR for scanned pages (stage 2, $0; needs the `tesseract` binary)
#   docling  = rich structure/tables (optional richer path)
extraction = [
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
]
# In-process Docling (pulls ~1GB ML models into the app process). Prefer `docling-serve`.
docling = ["docling>=2.0"]
# Remote Docling: talk to the docling-serve container (infrastructure/docker) over HTTP.
# Only needs an HTTP client here — the models live in the container.
docling-serve = ["httpx>=0.27"]
# Indra OCR (ONNX CPU) behind the OcrEngine seam. Weights are OpenRAIL-M (restricted).
indra = ["indra-ocr>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ikip_docproc"]

[tool.uv.sources]
ikip-common = { workspace = true }
